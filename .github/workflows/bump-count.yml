name: Bump renamed count

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'number of renamed files to add'
        required: false
        default: '1'

# GITHUB_TOKEN 默认对当前仓库有 contents:write，足够写回 count.json
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump count.json by payload
        env:
          ADD: ${{ github.event.inputs.count }}
        run: |
          set -e
          cur=$(jq '.renamed' count.json)
          add=${ADD:-1}
          # 防止异常/负数（允许 0，便于测试 dispatch 不污染计数）
          if ! [ "$add" -eq "$add" ] 2>/dev/null; then add=1; fi
          if [ "$add" -lt 0 ]; then add=0; fi
          n=$(( cur + add ))
          jq --argjson n "$n" '.renamed = $n' count.json > count.tmp.json
          mv count.tmp.json count.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add count.json
          git commit -m "bump renamed count -> $n" || echo "nothing to commit"
          git push
